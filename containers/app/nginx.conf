worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        client_max_body_size 82000000;
        client_body_timeout 60s;
        location = /health { return 200 'ready'; }
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;
        }
        location @api_unavailable {
            default_type application/json;
            return 503 '{"status":"error","reason":"The model service is unavailable. Start the app and try again."}';
        }
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            return 413 '{"status":"error","reason":"Upload too large. The demo limit is 80 MB per slide."}';
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
