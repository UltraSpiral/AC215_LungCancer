steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ['build', '--platform', 'linux/amd64', '-f', 'containers/app/backend.Dockerfile',
           '--target', 'runtime', '-t', '${_REGISTRY}/api:${_TAG}', '.']
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '--platform', 'linux/amd64', '-f', 'containers/app/frontend.Dockerfile',
           '--build-arg', 'NGINX_CONF=containers/app/nginx.cloudrun.conf',
           '-t', '${_REGISTRY}/web:${_TAG}', '.']
images: ['${_REGISTRY}/api:${_TAG}', '${_REGISTRY}/web:${_TAG}']
substitutions:
  _REGISTRY: us-central1-docker.pkg.dev/ac215-lungcancer/lungcancer
  _TAG: v1
options:
  machineType: E2_HIGHCPU_8
