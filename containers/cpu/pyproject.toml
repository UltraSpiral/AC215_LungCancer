requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.1.3",
  "scipy==1.16.3",
  "scikit-learn==1.6.1",
  "Pillow==11.3.0",
  "joblib==1.6.0",
  "requests==2.32.4",
  "openslide-python==1.4.6",
  "openslide-bin==4.0.1.2",
  "pytest==8.4.2",
]

[tool.uv]
package = false
