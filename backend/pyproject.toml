[project]
name = "lungcancer-cached-app"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.1.3", "scipy==1.16.3", "scikit-learn==1.6.1",
  "Pillow==11.3.0", "joblib==1.6.0", "requests==2.32.4",
  "openslide-python==1.4.6", "openslide-bin==4.0.1.2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx>=0.28,<1"]

[tool.uv]
package = false
