name: lungcancer-app
services:
  api:
    image: ${LC_APP_API_IMAGE:-lungcancer-app-api:milestone2}
    platform: linux/arm64
    build:
      context: .
      dockerfile: containers/app/backend.Dockerfile
      target: runtime
    user: "${LC_APP_UID:-10001}:${LC_APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /work/uploads:size=256m,mode=1777
      - /tmp:size=16m,mode=1777
    volumes:
      - ${LC_APP_BUNDLE:-./local_data/cpu_bundle}:/inputs:ro
      - ${LC_APP_OUTPUT:-./local_outputs/app/jobs}:/work/jobs
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 10s

  web:
    image: ${LC_APP_WEB_IMAGE:-lungcancer-app-web:milestone2}
    platform: linux/arm64
    build:
      context: .
      dockerfile: containers/app/frontend.Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - "127.0.0.1:${LC_APP_PORT:-8080}:8080"
    networks: [app, ingress]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 4s
      retries: 20

  app-tests:
    profiles: [test]
    image: lungcancer-app-tests:milestone2
    platform: linux/arm64
    build:
      context: .
      dockerfile: containers/app/backend.Dockerfile
      target: tests
    user: "${LC_APP_UID:-10001}:${LC_APP_GID:-10001}"
    read_only: true
    network_mode: none
    tmpfs:
      - /work/uploads:size=256m,mode=1777
      - /tmp:size=256m,mode=1777
    volumes:
      - ${LC_APP_BUNDLE:-./local_data/cpu_bundle}:/inputs:ro
      - ${LC_APP_OUTPUT:-./local_outputs/app/jobs}:/work/jobs

networks:
  app:
    internal: true
  ingress: {}
