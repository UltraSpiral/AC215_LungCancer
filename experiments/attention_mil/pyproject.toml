[project]
name = "attention-mil"
version = "0.1.0"
description = "CPU-only gated attention MIL head on cached UNI2-h tile embeddings"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.15.0",
  "numpy==2.1.3",
  "scipy==1.16.3",
  "scikit-learn==1.6.1",
  "joblib==1.6.0",
  "Pillow==11.3.0",
  "openslide-python==1.4.6",
  "openslide-bin==4.0.1.2",
  "matplotlib==3.11.2",
  "pytest==8.4.2",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
